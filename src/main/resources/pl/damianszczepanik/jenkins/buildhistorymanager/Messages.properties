# === GENERIC
isEmpty=Value must not be empty
notInteger=Provided value is not an integer
#
# === RULE
rule.notValidMatchAtMost=Provide integer value or -1 if the rule execution should not be limited
#
# === FIELDS
buildDescription.matchingMethodType.EQUALS=Equals pattern
buildDescription.matchingMethodType.CONTAINS=Contains pattern
buildDescription.matchingMethodType.MATCHES=Matches pattern (regular expression)
#
# === PRECEDENCE
configuration.precedenceMode.JOB_ONLY=Use only job level configuration, ignores others
configuration.precedenceMode.GLOBAL_ONLY=Use only global configuration, ignores others
configuration.precedenceMode.GLOBAL_THEN_JOB=Use global configuration, then job level configuration.
configuration.precedenceMode.JOB_THEN_GLOBAL=Use job level configuration, then global configuration
